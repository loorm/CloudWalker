<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LARC CloudWalker</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      color: #aaa;
      user-select: none;
    }

    #game-wrap {
      position: relative;
      display: inline-block;
      line-height: 0;
      touch-action: none;
    }

    canvas {
      display: block;
      /* Fill window while preserving 16:9 aspect ratio — no JS needed */
      width: min(100vw, calc(100vh * 16 / 9));
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 2px solid #222;
    }

    #dpad {
      position: absolute;
      bottom: 3%;
      right: 2%;
      display: grid;
      grid-template-areas:
        ".    up   ."
        "left .    right"
        ".    down .";
      grid-template-columns: repeat(3, var(--btn));
      grid-template-rows:    repeat(3, var(--btn));
      gap: 5px;
      --btn: clamp(44px, 7vmin, 70px);
      pointer-events: none;
    }

    .dpad-btn {
      pointer-events: auto;
      width: var(--btn);
      height: var(--btn);
      background: rgba(255, 255, 255, 0.18);
      border: 2px solid rgba(255, 255, 255, 0.50);
      border-radius: 10px;
      color: rgba(255, 255, 255, 0.80);
      font-size: calc(var(--btn) * 0.38);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.30);
    }

    .dpad-btn:active {
      background: rgba(255, 255, 255, 0.38);
      border-color: rgba(255, 255, 255, 0.80);
    }

    #dpad-up    { grid-area: up; }
    #dpad-left  { grid-area: left; }
    #dpad-right { grid-area: right; }
    #dpad-down  { grid-area: down; }

    #hint {
      margin-top: 10px;
      font-size: 11px;
      color: #444;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="gameCanvas"></canvas>
    <div id="dpad">
      <button class="dpad-btn" id="dpad-up">▲</button>
      <button class="dpad-btn" id="dpad-left">◀</button>
      <button class="dpad-btn" id="dpad-right">▶</button>
      <button class="dpad-btn" id="dpad-down">▼</button>
    </div>
  </div>
  <div id="hint">
    Run with: <code>npx serve .</code> &nbsp;|&nbsp;
    Or Chrome: <code>--allow-file-access-from-files</code>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
